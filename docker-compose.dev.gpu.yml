# GPU override for development — use with:
#   docker compose -f docker-compose.dev.yml -f docker-compose.dev.gpu.yml build
#   docker compose -f docker-compose.dev.yml -f docker-compose.dev.gpu.yml up -d
#
# ─────────────────────────────────────────────────────────────────────────────
# What this does
# ─────────────────────────────────────────────────────────────────────────────
# Accelerates the two ONNX-based inference models that run inside the backend
# container by switching from onnxruntime (CPU) to onnxruntime-gpu (CUDA):
#
#   1. SPLADE sparse embedder (prithivida/Splade_PP_en_v1)
#      - Used for sparse retrieval in every rag_retrieve call
#      - Encodes the query into a sparse vector for Qdrant sparse search
#
#   2. Cross-encoder reranker (Xenova/ms-marco-MiniLM-L-12-v2)
#      - Used to re-score (query, chunk) pairs after RRF merging
#      - Runs on every retrieval pass (up to 2 passes per query + rewrite retry)
#
# Both models are loaded once as singletons and reused across all requests.
# On GPU they use CUDAExecutionProvider; on CPU they use CPUExecutionProvider.
# This override does NOT affect:
#   - Dense embedding generation (uses an external OpenAI-compatible API)
#   - LLM inference (uses an external OpenAI-compatible API)
#   - Qdrant vector search (runs in the separate qdrant container)
#   - Neo4j graph operations (runs in the separate neo4j container)
#
# ─────────────────────────────────────────────────────────────────────────────
# Host prerequisites
# ─────────────────────────────────────────────────────────────────────────────
# - NVIDIA GPU with CUDA 12.x support
# - NVIDIA drivers installed on the host (nvidia-smi must work)
# - NVIDIA Container Toolkit (nvidia-docker2) installed on the host
#     https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/install-guide.html
# - Docker Engine 19.03+ (required for --gpus / deploy.resources support)
# - CuDNN 9.x (required by onnxruntime-gpu >= 1.19.0)
#     Ubuntu: sudo apt-get install -y cudnn-cuda-12
#
# ─────────────────────────────────────────────────────────────────────────────
# What this file changes
# ─────────────────────────────────────────────────────────────────────────────
# 1. Build arg USE_GPU=true → Dockerfile.dev installs fastembed-gpu (which
#    pulls onnxruntime-gpu) instead of fastembed (which pulls onnxruntime).
#    The two packages are mutually exclusive — fastembed-gpu replaces fastembed.
#
# 2. Environment FASTEMBED_USE_GPU=true → the backend passes cuda=True to
#    SparseTextEmbedding and TextCrossEncoder at model load time, requesting
#    CUDAExecutionProvider from the ONNX runtime.
#
# 3. NVIDIA runtime → docker compose starts the container with the nvidia
#    runtime, which passes GPU device nodes and CUDA libraries into the
#    container so onnxruntime-gpu can access them. Uses
#    NVIDIA_VISIBLE_DEVICES=all to expose every GPU.
#    Note: deploy.resources.reservations.devices (CDI/--gpus) does NOT work
#    with snap-installed Docker due to filesystem confinement. The nvidia
#    runtime bypasses this limitation.
#
# ─────────────────────────────────────────────────────────────────────────────
# Usage
# ─────────────────────────────────────────────────────────────────────────────
# Build (must rebuild to swap the pip package):
#   docker compose -f docker-compose.dev.yml -f docker-compose.dev.gpu.yml build backend
#
# Start:
#   docker compose -f docker-compose.dev.yml -f docker-compose.dev.gpu.yml up -d
#
# Verify GPU is in use inside the container:
#   docker exec rag-web-ui-backend-1 python -c \
#     "import onnxruntime; print(onnxruntime.get_available_providers())"
#   # Should print: ['CUDAExecutionProvider', 'CPUExecutionProvider']
#
# Stop:
#   docker compose -f docker-compose.dev.yml -f docker-compose.dev.gpu.yml down
#
# ─────────────────────────────────────────────────────────────────────────────
# Switching back to CPU
# ─────────────────────────────────────────────────────────────────────────────
# Rebuild without the override (no need to pass --build-arg manually):
#   docker compose -f docker-compose.dev.yml build backend
#   docker compose -f docker-compose.dev.yml up -d

services:
  backend:
    build:
      args:
        USE_GPU: "true"
    environment:
      - FASTEMBED_USE_GPU=true
      - NVIDIA_VISIBLE_DEVICES=all
      - LD_LIBRARY_PATH=/usr/local/cuda/lib64:/usr/lib/x86_64-linux-gnu
    volumes:
      - /usr/local/cuda-13.1:/usr/local/cuda:ro
      - /usr/lib/x86_64-linux-gnu/libcudnn.so.9:/usr/lib/x86_64-linux-gnu/libcudnn.so.9:ro
      - /usr/lib/x86_64-linux-gnu/libcudnn_graph.so.9:/usr/lib/x86_64-linux-gnu/libcudnn_graph.so.9:ro
      - /usr/lib/x86_64-linux-gnu/libcudnn_engines_runtime_compiled.so.9:/usr/lib/x86_64-linux-gnu/libcudnn_engines_runtime_compiled.so.9:ro
      - /usr/lib/x86_64-linux-gnu/libcudnn_engines_precompiled.so.9:/usr/lib/x86_64-linux-gnu/libcudnn_engines_precompiled.so.9:ro
      - /usr/lib/x86_64-linux-gnu/libcudnn_heuristic.so.9:/usr/lib/x86_64-linux-gnu/libcudnn_heuristic.so.9:ro
      - /usr/lib/x86_64-linux-gnu/libcudnn_cnn.so.9:/usr/lib/x86_64-linux-gnu/libcudnn_cnn.so.9:ro
      - /usr/lib/x86_64-linux-gnu/libcudnn_ops.so.9:/usr/lib/x86_64-linux-gnu/libcudnn_ops.so.9:ro
    runtime: nvidia
